<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dsh fireworks</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.6 -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: rgba(255, 236, 200, .92);
    background: rgba(12, 14, 20, .78);
    padding: 3px 10px; border-radius: 8px;
    letter-spacing: .04em;
    opacity: 0; transition: opacity .8s ease; pointer-events: none;
  }
  #hint.show { opacity: 1; }
</style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="hint">采集器未运行 · 运行 feeder/start_feeder.ps1</div>
  <!-- liveness marker: visible whenever THIS html is loaded at all.
       The renderer's FX badge pill (86x18, bottom-left) covers it once the
       current fireworks.js runs; a bare red dot means stale cached JS. -->
  <div id="mk" style="position:fixed;left:10px;bottom:12px;width:10px;height:10px;
       border-radius:50%;background:#ff4444;opacity:.9;pointer-events:none"></div>
  <script>
    /* Liveness probe matrix:
       RED    = HTML loaded, no script executed at all
       GREEN  = inline script ran (scripts allowed), external JS not started
       GOLD   = external fireworks.js executing (its first line flips the dot)
       BADGE  = renderer main loop running (gold dot gets covered by the pill)
       Any renderer error prints "ERR: ..." into the hint line. */
    window.onerror = function (msg) {
      var h = document.getElementById('hint');
      if (h) { h.textContent = 'ERR: ' + msg; h.classList.add('show'); }
    };
    (function () {
      var mk = document.getElementById('mk');
      if (mk) mk.style.background = '#22cc55';
    })();
  </script>
  <script src="./fireworks.js?v=10"></script>
</body>
</html>
